<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Compra de Salgado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-container">
        <div class="logo">Logo</div>
    </div>

    <form id="snackForm">
        <h2>Pedido de Salgados</h2>
        
        <div class="campo">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="campo">
            <label>Tipos de Salgado (pode marcar mais de um)</label>
            <div class="options-container">
                <label class="radio-option">
                    <input type="checkbox" name="tipoSalgado" value="Coxinha"> Coxinha
                </label>
                <label class="radio-option">
                    <input type="checkbox" name="tipoSalgado" value="Kibe"> Kibe
                </label>
                <label class="radio-option">
                    <input type="checkbox" name="tipoSalgado" value="Empada"> Empada
                </label>
                <label class="radio-option">
                    <input type="checkbox" name="tipoSalgado" value="Enroladinho de Salsicha"> Enroladinho de Salsicha
                </label>
                <label class="radio-option">
                    <input type="checkbox" name="tipoSalgado" value="Bolinha de Queijo"> Bolinha de Queijo
                </label>
                <label class="radio-option">
                    <input type="checkbox" name="tipoSalgado" value="Camarão"> Camarão
                </label>
                <label class="radio-option">
                    <input type="checkbox" name="tipoSalgado" value="Queijo com Alho"> Queijo com Alho
                </label>
                <label class="radio-option">
                    <input type="checkbox" name="tipoSalgado" value="Diversos / Misto"> Diversos / Misto
                </label>
            </div>
        </div>

        <div class="campo">
            <label>Quantidade de Salgados</label>
            <div class="options-container">
                <label class="radio-option">
                    <input type="radio" name="quantidade" value="25" required> 25 Unidades
                </label>
                <label class="radio-option">
                    <input type="radio" name="quantidade" value="50"> 50 Unidades
                </label>
                <label class="radio-option">
                    <input type="radio" name="quantidade" value="100"> 100 Unidades
                </label>
                <label class="radio-option">
                    <input type="radio" name="quantidade" value="outro"> Outra quantidade
                </label>
            </div>
        </div>

        <div class="campo" id="customQuantityGroup" style="display: none;">
            <label for="customQuantity">Especifique a quantidade</label>
            <input type="number" id="customQuantity" name="customQuantity" min="1" placeholder="Ex: 200">
        </div>

        <button type="submit" id="btnSubmit">Enviar Pedido</button>
    </form>

    <div id="successMessage" class="escondido">
        <h3>Pedido Enviado com Sucesso! 🎉</h3>
        <p>Seus dados foram registrados na planilha do Google Sheets.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
