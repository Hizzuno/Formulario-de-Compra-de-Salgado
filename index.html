<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Compra de Salgado</title>
    <link rel="stylesheet" href="/Formulario-de-Compra-de-Salgado/style.css">
</head>
<body>

    <div class="container">
        <form id="snackForm">
            <h2>Pedido de Salgados</h2>
            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="tipoSalgado">Tipo de Salgado</label>
                <select id="tipoSalgado" name="tipoSalgado" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="Coxinha">Coxinha</option>
                    <option value="Kibe">Kibe</option>
                    <option value="Empada">Empada</option>
                    <option value="Enroladinho de Salsicha">Enroladinho de Salsicha</option>
                    <option value="Bolinho de Queijo">Bolinho de Queijo</option>
                    <option value="Diversos / Misto">Diversos / Misto</option>
                </select>
            </div>

            <div class="input-group">
                <label>Quantidade de Salgados</label>
                <div class="quantity-options">
                    <label class="radio-option">
                        <input type="radio" name="quantidade" value="25" required> 25 Unidades
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="quantidade" value="50"> 50 Unidades
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="quantidade" value="100"> 100 Unidades
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="quantidade" value="outro"> Outra quantidade
                    </label>
                </div>
            </div>

            <div class="input-group" id="customQuantityGroup" style="display: none;">
                <label for="customQuantity">Especifique a quantidade</label>
                <input type="number" id="customQuantity" name="customQuantity" min="1" placeholder="Ex: 200">
            </div>

            <button type="submit" id="btnSubmit">Enviar Pedido</button>
        </form>

        <div id="successMessage" style="display: none;">
            <h3>Pedido Enviado com Sucesso! 🎉</h3>
            <p>Seus dados foram registrados na planilha do Google Sheets.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
